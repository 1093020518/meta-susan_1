# docker-virt.cfg — container kernel features for docker-moby, ported from the
# old project (meta-ubuntu24) which pulled kmeta `features/docker/docker.scc`.
# linux-cip has no kmeta (KMETA=""), so it cannot use .scc/KERNEL_FEATURES; this
# file materializes docker.scc's CONFIGs as a plain .cfg merge fragment instead.
# Keep the container requirements explicit because linux-cip does not consume
# Yocto kernel-meta .scc features in this configuration.
#
# Mirrors kmeta cfg/docker.cfg (10 symbols) EXCEPT CONFIG_NETFILTER_XT_MATCH_IPVS:
# that one needs CONFIG_IP_VS (off in the validated configuration),
# so kmeta requests it but it never resolves — omitted to match the old project's
# actual built config and keep do_kernel_configcheck warning-free. Enable IP_VS
# (e.g. kube-proxy IPVS mode) and add it back if needed.
#   OVERLAY_FS  -> overlay2 storage driver
#   NF_CONNTRACK + NF_NAT + IP_NF_NAT + IP_NF_FILTER + IP_NF_TARGET_MASQUERADE + XT_MATCH_ADDRTYPE -> netfilter / port mapping
#   CGROUP_BPF  -> already on; fragment keeps it on
#   DM_THIN_PROVISIONING -> devicemapper fallback (harmless for overlay2)
CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=m
CONFIG_IP_NF_FILTER=m
CONFIG_NF_NAT=m
CONFIG_NF_CONNTRACK=y
CONFIG_DM_THIN_PROVISIONING=m
CONFIG_IP_NF_NAT=m
CONFIG_IP_NF_TARGET_MASQUERADE=m
CONFIG_OVERLAY_FS=y
CONFIG_CGROUP_BPF=y
CONFIG_VETH=m
CONFIG_BRIDGE=m
CONFIG_BRIDGE_NETFILTER=m
CONFIG_BPF_SYSCALL=y
CONFIG_NETFILTER_ADVANCED=y
CONFIG_NETFILTER_XT_MATCH_PHYSDEV=m
CONFIG_MEMCG=y
CONFIG_MEMCG_SWAP=y
CONFIG_CFS_BANDWIDTH=y
