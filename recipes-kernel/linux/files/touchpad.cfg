# touchpad.cfg — enable the Intel Raptor Lake Serial IO I2C touchpad.
# The touchpad is an I2C-HID device behind the Designware PCI I2C controller
# (8086:7a4c) gated by the Intel LPSS MFD. The base genericx86-64 config leaves
# the controller + the I2C-HID ACPI binding + multitouch off, so the touchpad
# never enumerates. Turn them all on, built-in (=y) so it works with no
# module-load dependency.
#
# Covers both symbol layouts: 6.6 exposes the combined CONFIG_I2C_HID, while
# 6.12 splits it into I2C_HID_CORE + I2C_HID_ACPI. We request all of them; the
# kernel silently drops whichever a given version doesn't expose (a harmless
# configcheck warning), so the same fragment fixes the touchpad on both kernels.
CONFIG_MFD_INTEL_LPSS=y
CONFIG_MFD_INTEL_LPSS_PCI=y
CONFIG_I2C_DESIGNWARE_CORE=y
CONFIG_I2C_DESIGNWARE_PCI=y
CONFIG_I2C_DESIGNWARE_PLATFORM=y
CONFIG_I2C_HID=y
CONFIG_I2C_HID_CORE=y
CONFIG_I2C_HID_ACPI=y
CONFIG_HID_MULTITOUCH=y
CONFIG_SERIAL_DEV_BUS=y

# --- GPIO controller (the missing piece) ---
# The touchpad (ELAN07F0, ACPI HID-I2C PNP0C50) is on the Designware I2C
# controller, which IS up via MFD_INTEL_LPSS_PCI. But the touchpad's reset
# GPIO comes off the Intel PCH pinctrl/GPIO controller (ACPI HID INTC1085 on
# this i7-14650HX / Raptor Lake-S HX platform). The base genericx86-64 config
# builds NO Intel pinctrl driver at all (CONFIG_PINCTRL=y framework only), so
# INTC1085 never binds -> no GPIOs -> i2c-hid-acpi's reset-gpio lookup returns
# -EPROBE_DEFER -> i2c-ELAN07F0:00 sits in /sys/kernel/debug/devices_deferred
# forever and the touchpad never enumerates. Enable the Alder Lake pinctrl
# driver built-in: its ACPI match table (pinctrl-alderlake.c) claims INTC1085
# -> adls_soc_data, which is the Alder Lake-S / Raptor Lake-S HX GPIO community
# layout (the 14650HX pairs with the ADL-S-compatible PCH). PINCTRL_INTEL is
# auto-selected by PINCTRL_ALDERLAKE (listed explicitly for clarity/configcheck).
CONFIG_PINCTRL_INTEL=y
CONFIG_PINCTRL_ALDERLAKE=y
