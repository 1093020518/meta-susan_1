# wifi.cfg — enable the Intel WiFi driver for the AX211 CNVi WiFi adapter.
#
# This laptop's WiFi is the Intel Raptor Lake PCH CNVi WiFi (PCI 8086:7a70 =
# AX211, WiFi 6E). The base genericx86-64 kernel config builds the cfg80211/
# mac80211 stack (=m, CONFIG_CFG80211/CONFIG_MAC80211 are already on) and even
# other vendors' drivers (ath9k, brcmfmac, mt7601u are present in /lib/modules),
# but it leaves CONFIG_IWLWIFI off, so the Intel card never binds and there is
# no wlan0 / no rfkill device. AX211 uses the iwlwifi *MVM* opmode (CONFIG_IWLMVM,
# the 8000-series+ firmware path; IWLDVM is the older 7000-series path and is not
# needed here). The matching firmware (iwlwifi-so-a0-gf-a0-*.ucode + .pnvm) is
# already shipped by the bare linux-firmware package in the image, and the
# regulatory database ships via wireless-regdb -- this fragment only builds the
# driver. Built as modules (=m) so iwlwifi+iwlmvm load on demand (udev auto-
# loads on PCI match, NetworkManager then brings up the wlan0 interface).
CONFIG_IWLWIFI=m
CONFIG_IWLMVM=m
