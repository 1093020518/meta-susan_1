#
# Intel IPU6 camera support
#

# Core Media / V4L2
CONFIG_MEDIA_SUPPORT=y
CONFIG_MEDIA_CAMERA_SUPPORT=y
CONFIG_MEDIA_CONTROLLER=y
CONFIG_MEDIA_PCI_SUPPORT=y
CONFIG_VIDEO_DEV=y
CONFIG_VIDEO_V4L2_SUBDEV_API=y

# Required platform buses / infrastructure
CONFIG_PCI=y
CONFIG_ACPI=y
CONFIG_I2C=y
CONFIG_SPI=y
CONFIG_GPIOLIB=y
CONFIG_COMMON_CLK=y
CONFIG_LEDS_CLASS=y

# Intel MEI infrastructure
CONFIG_INTEL_MEI=m

# Intel IPU6 Core + ISYS
CONFIG_VIDEO_INTEL_IPU6=m
CONFIG_IPU_BRIDGE=m

# Camera power / ACPI
CONFIG_INTEL_SKL_INT3472=m

# Intel Visual Sensing Controller transport
CONFIG_INTEL_MEI_VSC_HW=m
CONFIG_INTEL_MEI_VSC=m

# Intel IVSC camera routing
CONFIG_INTEL_VSC=m

# Intel LJCA bridge
CONFIG_USB_LJCA=m
CONFIG_GPIO_LJCA=m
CONFIG_I2C_LJCA=m
CONFIG_SPI_LJCA=m

CONFIG_REGULATOR=y
