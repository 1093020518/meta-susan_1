# board-bsp.cfg — minimal real-hardware BSP for THIS box, applied on top of the
# thin x86_64_defconfig baseline with alldefconfig.
#
# ===== 真机早挂定位 / 根因 (ROOT CAUSE) =====
#   最初假设"薄 defconfig 只缺 NVMe+FB+IGC 三组 BSP"导致早挂 → 加上这三组(v12)仍
#   卡在同一处 → 假设被证伪。重新 diff 卡死的 lean .config 与 *能启动* 的
#   /proc/config.gz(v11/proven 真机实跑配置), 发现真正的早启动差异只有两处:
#     (A) HYPERVISOR_GUEST(=Linux guest support 总开关) 薄默认 =y → 整个 paravirt
#         家族(PARAVIRT / KVM_GUEST / PARAVIRT_CLOCK=kvmclock / PTP_1588_CLOCK_KVM /
#         X86_HV_CALLBACK_VECTOR)全开; proven 是 `# CONFIG_HYPERVISOR_GUEST is not set`
#         → 这些全关(变不可见)。裸金属上开 KVM_GUEST/kvmclock = "误以为跑在虚拟机里",
#         早启动时钟/回调路径异常。
#     (B) X86_X2APIC 薄默认 =n; proven =y。本机 BIOS 默认开 x2APIC, 内核 CONFIG 关掉
#         → APIC 此时已在 x2APIC/MSR 模式、MMIO 读不到 → LAPIC 初始化失败 → 无 APIC
#         定时器中断 → 在起 console/fbcon 之前就挂死(黑屏, 即使 FB_EFI 编进去了)。
#   (A)(B) 都在 console/fbcon 起来之前生效 → 印象就是"卡在 GRUB 最后一行"的黑屏。
#   NVMe/FB/IGC 是下游(根盘/显示/网卡), 挂点在它们之前, 故不是病因, 但仍需保留
#   (否则就算启动成功也找不到根盘/没显示/没网)。
#
# 三组 BSP(下游, 但仍必需): 根盘 NVMe / EFI 帧缓冲显示 / I226-V 网卡
# --- 1. NVMe boot disk (rootfs A/B on nvme0n1p4/p5) ---
CONFIG_BLK_DEV_NVME=y
# --- 2. EFI framebuffer display ---
CONFIG_FB=y
CONFIG_FB_EFI=y
CONFIG_FRAMEBUFFER_CONSOLE=y
CONFIG_FRAMEBUFFER_CONSOLE_DETECT_PRIMARY=y
# --- 3. Intel I226-V NIC ---
CONFIG_IGC=m

# ====== 真·早启动修复(对齐 proven/v11) ======
# 关掉 Linux guest support 总开关 → 整个 paravirt/KVM 家族随之不可见(=off),
# Match the hardware-validated setting: disable HYPERVISOR_GUEST.
# CONFIG_HYPERVISOR_GUEST is not set
# 开 x2APIC(本机 BIOS 默认开 x2APIC; 内核关了会早挂)。
# 注意: X86_X2APIC 依赖 (IRQ_REMAP || HYPERVISOR_GUEST); 上面把 HYPERVISOR_GUEST 关了,
# 故必须开 IRQ_REMAP 才能让 X86_X2APIC 可见/生效(薄 defconfig 默认 IRQ_REMAP=n → 不开会被
# olddefconfig 丢掉, 已验证)。IRQ_REMAP 的依赖 IOMMU_SUPPORT/DMAR_TABLE/INTEL_IOMMU 薄 defconfig 已默认 =y。
CONFIG_IRQ_REMAP=y
CONFIG_X86_X2APIC=y
