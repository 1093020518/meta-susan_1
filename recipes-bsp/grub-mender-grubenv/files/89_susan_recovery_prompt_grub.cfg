set susan_recovery_requested=0
echo "Press any key within 5 seconds to boot Susan Recovery."
if sleep --interruptible 5; then
    set susan_recovery_requested=0
else
    set susan_recovery_requested=1
fi

if [ "${susan_recovery_requested}" = "1" ]; then
    insmod part_gpt
    insmod ext2
    search --no-floppy --label recovery --set=recovery_root

    echo "Booting Susan Recovery from ${recovery_root}"
    linux (${recovery_root})/boot/bzImage root=LABEL=recovery rootfstype=ext4 ro recovery_mode=1 console=ttyS0,115200 console=tty0
    boot
fi
