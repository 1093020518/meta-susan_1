menuentry 'Susan Recovery' {
    insmod part_gpt
    insmod ext2
    search --no-floppy --label recovery --set=recovery_root

    echo "Booting Susan Recovery from ${recovery_root}"
    linux (${recovery_root})/boot/bzImage root=/dev/nvme0n1p3 rootfstype=ext4 ro rootwait recovery_mode=1 console=ttyS0,115200 console=tty0
    boot
}
